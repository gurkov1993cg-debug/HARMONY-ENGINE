name: HARMONY ENGINE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'HARMONY-ENGINE.zip'

permissions:
  contents: read

concurrency:
  group: harmony-engine-macos
  cancel-in-progress: true

jobs:
  macos-intel-vst3:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract HARMONY ENGINE source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          mkdir source
          ditto -x -k HARMONY-ENGINE.zip source
          test -f source/HARMONY-ENGINE/CMakeLists.txt
          echo "HARMONY_SOURCE=$GITHUB_WORKSPACE/source/HARMONY-ENGINE" >> "$GITHUB_ENV"

      - name: Verify source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("source/HARMONY-ENGINE")
          forbidden = "J" + "UCE"
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() in {".png", ".zip"}:
                  continue
              text = path.read_text(errors="ignore")
              if path.name == "IMAC2011_VST3_BUILD_RULE.md":
                  continue
              assert forbidden not in text and forbidden.lower() not in text.lower(), path
          cm = (root / "CMakeLists.txt").read_text()
          assert "smtg_enable_vst3_sdk()" in cm
          assert "smtg_add_vst3plugin(HarmonyEngine" in cm
          assert "public.sdk/source/main/macmain.cpp" in cm  # configure-time verification only
          assert "pluginfactory_constexpr.h" in (root / "plugin/PluginFactory.cpp").read_text()
          print("HARMONY source contract OK")
          PY

      - name: Configure DSP core
        run: cmake -S "$HARMONY_SOURCE" -B build-core

      - name: Build DSP core tests
        run: cmake --build build-core --parallel 4

      - name: Run DSP tests
        run: ctest --test-dir build-core --output-on-failure

      - name: Checkout Steinberg VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          path: vst3sdk
          submodules: recursive

      - name: Configure Intel VST3
        run: >-
          cmake -S "$HARMONY_SOURCE" -B build-vst3 -G Xcode
          -DBUILD_VST3_ADAPTER=ON
          -DVST3_SDK_DIR="$GITHUB_WORKSPACE/vst3sdk"
          -DCMAKE_OSX_ARCHITECTURES=x86_64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          -DSMTG_CREATE_PLUGIN_LINK=OFF

      - name: Build Intel VST3
        run: cmake --build build-vst3 --config Release --target HarmonyEngine --parallel 4

      - name: Verify Intel VST3
        shell: bash
        run: |
          set -euo pipefail
          VST=$(find build-vst3 -type d -name 'HarmonyEngine.vst3' -print -quit)
          test -n "$VST"
          BIN="$VST/Contents/MacOS/HarmonyEngine"
          test -f "$BIN"
          file "$BIN" | tee binary-info.txt
          ARCHS=$(lipo -archs "$BIN")
          test "$ARCHS" = "x86_64" || { echo "ERROR: expected x86_64 only, got: $ARCHS"; exit 1; }
          xcrun vtool -show-build "$BIN" | tee deployment-info.txt
          nm -gU "$BIN" | tee exported-symbols.txt
          grep -q '_bundleEntry' exported-symbols.txt
          grep -q '_bundleExit' exported-symbols.txt
          grep -q '_GetPluginFactory' exported-symbols.txt
          test -f "$VST/Contents/Info.plist"
          plutil -lint "$VST/Contents/Info.plist"
          codesign --verify --deep "$VST"

      - name: Collect VST3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact
          mkdir -p artifact
          VST=$(find build-vst3 -type d -name 'HarmonyEngine.vst3' -print -quit)
          test -n "$VST"
          cp -R "$VST" artifact/
          cp binary-info.txt deployment-info.txt exported-symbols.txt artifact/
          ditto -c -k --sequesterRsrc --keepParent "$VST" artifact/HARMONY-ENGINE-macOS-Intel.zip

      - name: Upload macOS Intel VST3
        uses: actions/upload-artifact@v4
        with:
          name: HARMONY-ENGINE-macOS-Intel
          path: artifact
          if-no-files-found: error
          retention-days: 30
