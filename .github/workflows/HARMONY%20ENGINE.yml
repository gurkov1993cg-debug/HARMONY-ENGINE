name: HARMONY ENGINE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-macos-intel:
    name: Build Intel VST3 - macOS 10.15 target
    runs-on: macos-15-intel

    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Intel runner
        shell: bash
        run: |
          set -euo pipefail
          echo "macOS:"
          sw_vers
          echo "Architecture:"
          uname -m
          test "$(uname -m)" = "x86_64"

      - name: Unpack HARMONY ENGINE source
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "HARMONY-ENGINE.zip" ]; then
            echo "ERROR: HARMONY-ENGINE.zip is missing from repository root."
            exit 1
          fi

          rm -rf source
          mkdir -p source
          ditto -x -k "HARMONY-ENGINE.zip" source

          CMAKE_FILE="$(find source -maxdepth 4 -name CMakeLists.txt -type f | head -n 1 || true)"

          if [ -z "$CMAKE_FILE" ]; then
            echo "ERROR: No CMakeLists.txt found inside HARMONY-ENGINE.zip."
            find source -maxdepth 5 -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$CMAKE_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project source directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$PROJECT_DIR" -B build             -DCMAKE_BUILD_TYPE=Release             -DHARMONY_BUILD_PLUGIN=ON             -DCMAKE_OSX_ARCHITECTURES=x86_64             -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15             -DCMAKE_OSX_SYSROOT=macosx

      - name: Build Harmony Engine
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --parallel 2

      - name: Run DSP tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure -C Release

      - name: Locate VST3
        shell: bash
        run: |
          set -euo pipefail

          VST3_PATH="$(find build -type d -name "*.vst3" | head -n 1 || true)"

          if [ -z "$VST3_PATH" ]; then
            echo "ERROR: No VST3 bundle was produced."
            find build -maxdepth 7 -print
            exit 1
          fi

          echo "VST3 found at: $VST3_PATH"
          echo "VST3_PATH=$VST3_PATH" >> "$GITHUB_ENV"

      - name: Verify Intel VST3 binary
        shell: bash
        run: |
          set -euo pipefail

          BIN="$(find "$VST3_PATH/Contents/MacOS" -type f | head -n 1 || true)"

          if [ -z "$BIN" ]; then
            echo "ERROR: VST3 executable was not found."
            exit 1
          fi

          echo "Binary:"
          file "$BIN"

          file "$BIN" | grep -q "x86_64" || {
            echo "ERROR: VST3 is not Intel x86_64."
            exit 1
          }

          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Verify macOS deployment target
        shell: bash
        run: |
          set -euo pipefail
          echo "Mach-O deployment information:"
          otool -l "$BIN" | grep -A 8 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" || true

      - name: Package VST3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent             "$VST3_PATH"             "dist/HARMONY-ENGINE-macOS-Intel-VST3.zip"

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: HARMONY-ENGINE-macOS-Intel-VST3
          path: dist/HARMONY-ENGINE-macOS-Intel-VST3.zip
          if-no-files-found: error
          retention-days: 30
