name: HARMONY ENGINE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-macos-intel:
    name: Build Intel VST3 - macOS 10.15 target
    runs-on: macos-15-intel

    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Intel runner
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          test "$(uname -m)" = "x86_64"

      - name: Unpack HARMONY ENGINE source
        shell: bash
        run: |
          set -euo pipefail
          test -f "HARMONY-ENGINE.zip"
          rm -rf source
          mkdir -p source
          ditto -x -k "HARMONY-ENGINE.zip" source
          CMAKE_FILE="$(find source -maxdepth 4 -name CMakeLists.txt -type f | head -n 1 || true)"
          test -n "$CMAKE_FILE"
          PROJECT_DIR="$(dirname "$CMAKE_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$PROJECT_DIR" -B build             -DCMAKE_BUILD_TYPE=Release             -DHARMONY_BUILD_PLUGIN=ON             -DCMAKE_OSX_ARCHITECTURES=x86_64             -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15             -DCMAKE_OSX_SYSROOT=macosx

      - name: Build Harmony Engine
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --parallel 2

      - name: Run DSP tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure -C Release

      - name: Locate and verify VST3
        shell: bash
        run: |
          set -euo pipefail
          VST3_PATH="$(find build -type d -name '*.vst3' | head -n 1 || true)"
          test -n "$VST3_PATH"

          BIN="$(find "$VST3_PATH/Contents/MacOS" -type f | head -n 1 || true)"
          test -n "$BIN"

          file "$BIN"
          file "$BIN" | grep -q 'Mach-O 64-bit'
          file "$BIN" | grep -q 'x86_64'

          echo "VST3_PATH=$VST3_PATH" >> "$GITHUB_ENV"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Verify macOS deployment target
        shell: bash
        run: |
          set -euo pipefail
          otool -l "$BIN" | grep -A8 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' || true

      - name: Stage direct VST3 bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          VST3_NAME="$(basename "$VST3_PATH")"
          ditto "$VST3_PATH" "dist/$VST3_NAME"

          test -d "dist/$VST3_NAME"
          test -f "dist/$VST3_NAME/Contents/Info.plist"
          test -d "dist/$VST3_NAME/Contents/MacOS"

          echo "DIRECT ARTIFACT CONTENTS:"
          find dist -maxdepth 5 -print

      - name: Upload direct VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: HARMONY-ENGINE-macOS-Intel-VST3
          path: dist/HarmonyEngine.vst3
          if-no-files-found: error
          retention-days: 30
